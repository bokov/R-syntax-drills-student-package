name: Copy fixed checker fallback

on:
  push:
    branches:
      - agent/fix-checker-closure-fallback

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out student package
        uses: actions/checkout@v5
        with:
          ref: agent/fix-checker-closure-fallback

      - name: Check out fixed authoring assets
        uses: actions/checkout@v5
        with:
          repository: bokov/R-syntax-drills
          ref: agent/fix-checker-closure
          path: authoring
          sparse-checkout: student-assets

      - name: Copy fixed fallback bank
        run: |
          cp authoring/student-assets/runtime_question_pool.Rmd inst/tutorials/drills/runtime_question_pool.Rmd
          cp authoring/student-assets/question_manifest.csv inst/tutorials/drills/question_manifest.csv

      - name: Commit fallback bank
        run: |
          git add -- inst/tutorials/drills/runtime_question_pool.Rmd inst/tutorials/drills/question_manifest.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update frozen fallback to fixed checker bank"
          git push origin HEAD:agent/fix-checker-closure-fallback
