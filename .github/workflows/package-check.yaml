name: Package check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out student package
        uses: actions/checkout@v4

      - name: Check out pinned authoring source
        uses: actions/checkout@v4
        with:
          repository: bokov/R-syntax-drills
          ref: d1bbc4b88db62062dd82aec7b9cf6fcdbaaf6314
          path: authoring

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Generate student-safe question assets
        run: Rscript tools/build_student_assets.R authoring

      - name: Remove authoring checkout
        run: rm -rf authoring

      - name: Upload generated runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: drillr-runtime-assets
          path: |
            inst/tutorials/drills/runtime_question_pool.Rmd
            inst/tutorials/drills/question_manifest.csv

      - name: Set up package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
