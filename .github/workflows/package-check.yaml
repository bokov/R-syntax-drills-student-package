name: Package check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out student package
        uses: actions/checkout@v4

      - name: Check out pinned authoring source
        uses: actions/checkout@v4
        with:
          repository: bokov/R-syntax-drills
          ref: d1bbc4b88db62062dd82aec7b9cf6fcdbaaf6314
          path: authoring
          sparse-checkout: |
            R/question_manifest.R
            R/assignment_storage.R
            R/player_builder.R
            question-bank
          sparse-checkout-cone-mode: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Generate student-safe question assets
        run: Rscript tools/build_student_assets.R authoring

      - name: Verify generated assets are current
        run: |
          git diff --exit-code -- \
            inst/tutorials/drills/runtime_question_pool.Rmd \
            inst/tutorials/drills/question_manifest.csv

      - name: Remove authoring checkout
        run: rm -rf authoring

      - name: Set up package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          cache-version: 1
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
