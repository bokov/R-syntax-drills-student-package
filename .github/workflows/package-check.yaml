name: Package check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out student package
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          extra-packages: any::rcmdcheck
          needs: check

      - name: Reject non-ASCII R source
        shell: Rscript {0}
        run: |
          paths <- c(
            list.files("R", pattern = "\\.[Rr]$", full.names = TRUE),
            if (file.exists("NAMESPACE")) "NAMESPACE" else character()
          )
          has_non_ascii <- vapply(paths, function(path) {
            bytes <- readBin(
              path,
              what = "raw",
              n = as.integer(file.info(path)$size)
            )
            any(as.integer(bytes) > 127L)
          }, logical(1))
          if (any(has_non_ascii)) {
            stop(
              "Non-ASCII bytes found in portable R package code: ",
              paste(paths[has_non_ascii], collapse = ", ")
            )
          }

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Check out student package
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Set up package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          extra-packages: any::pak
          needs: check

      - name: Install student package
        shell: Rscript {0}
        run: |
          pak::local_install(".", dependencies = NA)

      - name: Smoke test installed package
        shell: Rscript {0}
        run: |
          stopifnot(requireNamespace("drillr", quietly = TRUE))
          stopifnot(requireNamespace("gradethis", quietly = TRUE))
          stopifnot(requireNamespace("learnr", quietly = TRUE))

          tutorials <- learnr::available_tutorials("drillr")
          stopifnot("drills" %in% tutorials$name)

          tutorial_dir <- system.file(
            "tutorials", "drills",
            package = "drillr"
          )
          stopifnot(nzchar(tutorial_dir))
          stopifnot(file.exists(file.path(tutorial_dir, "drills.Rmd")))
