name: Package check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out student package
        uses: actions/checkout@v5

      - name: Check out pinned authoring assets
        uses: actions/checkout@v5
        with:
          repository: bokov/R-syntax-drills
          ref: d57e7c905495d788a3d1c328d41ff316fbed52cf
          path: authoring
          sparse-checkout: student-assets

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Verify bundled question assets
        run: |
          Rscript tools/build_student_assets.R authoring
          git diff --exit-code -- \
            inst/tutorials/drills/runtime_question_pool.Rmd \
            inst/tutorials/drills/question_manifest.csv

      - name: Remove authoring checkout
        run: rm -rf authoring

      - name: Set up package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
